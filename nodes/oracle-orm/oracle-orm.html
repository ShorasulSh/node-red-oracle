<script type="text/javascript">
    RED.nodes.registerType('oracle-orm', {
        category: 'function',
        color: '#E2D96E',
        icon: "font-awesome/fa-database",
        defaults: {
            name: { value: "" },
            oracle: { type: "oracle-config", required: true },
            query: { value: "", required: true }
        },
        inputs: 1,
        outputs: 1,
        label: function () {
            return this.name || "Oracle Query";
        }
    });
</script>

<div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" name="name" placeholder="Optional node label" />
</div>

<div class="form-row">
    <label for="node-input-oracle"><i class="fa fa-cogs"></i> Oracle Config</label>
    <input type="text" id="node-input-oracle" name="oracle" />
</div>

<div class="form-row">
    <label for="node-input-query"><i class="fa fa-code"></i> SQL Query</label><br />
    <textarea id="node-input-query" name="query" rows="5" style="width:100%;" placeholder="SELECT * FROM table WHERE id = :id"></textarea>
</div>
